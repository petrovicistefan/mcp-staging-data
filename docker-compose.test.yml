services:
  source:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: staging
      POSTGRES_PASSWORD: staging
      POSTGRES_DB: source_db
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging -d source_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  target:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: staging
      POSTGRES_PASSWORD: staging
      POSTGRES_DB: target_db
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging -d target_db"]
      interval: 2s
      timeout: 5s
      retries: 15
